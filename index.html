<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반려견 수제 간식</title>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fafafa;
      color: #333;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      background-color: #fff;
      border-bottom: 1px solid #eee;
    }

    header img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
    }

    h1 {
      font-size: 1.8rem;
      margin-top: 20px;
      font-weight: 600;
    }

    header p {
      font-size: 1rem;
      color: #666;
      max-width: 600px;
      margin: 10px auto 0;
      line-height: 1.6;
    }

    .product-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      padding: 60px 20px;
    }

    .product {
      background-color: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      width: 280px;
      text-align: center;
      padding: 20px;
      transition: transform 0.2s ease;
    }

    .product:hover {
      transform: translateY(-6px);
    }

    .product img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .product h2 {
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .price {
      font-size: 1.1rem;
      color: #ff8a65;
      font-weight: 600;
    }

    footer {
      text-align: center;
      padding: 30px;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <img src="images/dog_header.jpg" alt="귀여운 반려견 이미지">
    <h1>자연 그대로의 건강함, 반려견 수제 간식</h1>
    <p>
      사랑하는 반려견에게 가장 좋은 재료로 만든 건강한 간식,<br>
      하루의 행복을 담은 한 입을 선물합니다.
    </p>
  </header>

  <section class="product-section">
    <div class="product">
      <img src="images/cookie1.jpg" alt="닭가슴살 쿠키">
      <h2>닭가슴살 쿠키</h2>
      <p class="price">13,000원</p>
    </div>

    <div class="product">
      <img src="images/cookie2.jpg" alt="고구마 쿠키">
      <h2>고구마 쿠키</h2>
      <p class="price">15,000원</p>
    </div>

    <div class="product">
      <img src="images/cookie3.jpg" alt="연어 쿠키">
      <h2>연어 쿠키</h2>
      <p class="price">18,000원</p>
    </div>
  </section>

  <footer>
    © 2025 반려견 수제 간식 | 건강하고 맛있는 하루를 선물하세요 🐾
  </footer>
</body>
</html>
